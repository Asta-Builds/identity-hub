name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: |
          if [ -f pom.xml ]; then
            chmod +x mvnw 2>/dev/null || true
            ./mvnw -B verify
          else
            echo "No backend yet"
          fi

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test
        run: |
          if [ -f ui/package.json ]; then
            cd ui && npm ci && npm run build && npm test --if-present
          else
            echo "No UI yet"
          fi
