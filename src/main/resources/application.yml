spring:
  application:
    name: identity-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identityhub}
    username: ${DB_USER:identityhub}
    password: ${DB_PASSWORD:identityhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
